<!-- Mon Tresor Popup - START -->
<!-- Fullscreen takeover · 4 automatic seasonal themes · bilingual (DE/EN) · never scrolls -->
<!-- In IONOS: "Website" > "Einstellungen" > "Kopf-/Fußbereich bearbeiten" > "Body (Ende)" -->
<!--
  ==========================================================================
  QUICK REFERENCE
  ==========================================================================
  Themes switch automatically from the visitor's date (meteorological
  seasons, northern hemisphere):

      Spring  1 Mar - 31 May      fresh green / blossom  · petals
      Summer  1 Jun - 31 Aug      amber / turquoise      · light motes
      Autumn  1 Sep - 30 Nov      rust / gold            · falling leaves
      Winter  1 Dec - 28/29 Feb   ice blue / silver      · snow
                                  (December also turns festive: red/green)

  To preview a theme, add a parameter to any page URL:
      ?mtpTheme=spring      (spring | summer | autumn | winter | festive)
      ?mtpForce=1           show the popup again in the same session

  Texts, links and season labels live in the CONTENT block in the script at
  the bottom of this file - that is the only place you need to edit copy.
  Colours live in the THEMES block in the CSS right below.
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     1. DESIGN TOKENS
     Everything scales from the viewport, so the popup keeps the same
     proportions on a phone, a laptop and a 4K screen - and stays correct at
     any browser zoom level, because vw/vh follow the zoomed viewport.
     ========================================================================== */

  #mtp-root {
    /* Viewport units. --mtp-vh uses the *small* viewport (svh) where it is
       supported, so mobile browser toolbars can never push content out of
       view. Sizing maths below multiplies these instead of using vw/vh
       directly, which keeps one single place to adjust. */
    --mtp-vw: 1vw;
    --mtp-vh: 1vh;

    --mtp-font: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    /* Fluid spacing */
    --mtp-pad:   clamp(16px, calc(var(--mtp-vw) * 1.6 + var(--mtp-vh) * 1.2), 46px);
    --mtp-gap:   clamp(8px,  calc(var(--mtp-vw) * 0.35 + var(--mtp-vh) * 0.85), 20px);
    --mtp-r:     clamp(14px, calc(var(--mtp-vh) * 2.2), 26px);
    --mtp-r-sm:  clamp(10px, calc(var(--mtp-vh) * 1.4), 16px);
    --mtp-ctl:   clamp(34px, calc(var(--mtp-vh) * 4.6), 46px);

    /* Fluid type */
    --mtp-fs-title: clamp(21px,   calc(var(--mtp-vw) * 1.05 + var(--mtp-vh) * 1.5  + 6px),   42px);
    --mtp-fs-body:  clamp(13.5px, calc(var(--mtp-vw) * 0.3  + var(--mtp-vh) * 0.72 + 4px),   17.5px);
    --mtp-fs-btn:   clamp(13px,   calc(var(--mtp-vw) * 0.26 + var(--mtp-vh) * 0.6  + 4px),   16px);
    --mtp-fs-sm:    clamp(11.5px, calc(var(--mtp-vw) * 0.24 + var(--mtp-vh) * 0.55 + 3.5px), 14.5px);
    --mtp-fs-xs:    clamp(10px,   calc(var(--mtp-vw) * 0.2  + var(--mtp-vh) * 0.42 + 3px),   12.5px);

    /* Brand constant - the magenta stays across every season */
    --mtp-brand: #e2017b;

    /* Neutral surfaces */
    --mtp-card:  rgba(255, 255, 255, 0.72);
    --mtp-card2: rgba(255, 255, 255, 0.46);
  }

  @supports (height: 1svh) {
    #mtp-root { --mtp-vh: 1svh; }
  }

  /* ==========================================================================
     2. THEMES - one block per season. Edit colours here.
     ========================================================================== */

  /* ---- SPRING · fresh green, blossom pink ---- */
  #mtp-root[data-theme="spring"] {
    --mtp-a1: #3fa46b;
    --mtp-a2: #f06fae;
    --mtp-fx: #f06fae;
    --mtp-cta2: #b8237f;
    --mtp-ink: #1d2a23;
    --mtp-ink2: #5d6b63;
    --mtp-page: linear-gradient(155deg, #fbfefb 0%, #eff9f2 45%, #fdf3f8 100%);
    --mtp-glow1: rgba(63, 164, 107, 0.30);
    --mtp-glow2: rgba(240, 111, 174, 0.26);
    --mtp-line: rgba(63, 164, 107, 0.22);
    --mtp-shadow: rgba(31, 82, 55, 0.16);
    --mtp-scrim: linear-gradient(200deg, rgba(63, 164, 107, 0.22) 0%, rgba(255, 255, 255, 0) 42%, rgba(240, 111, 174, 0.24) 100%);
  }

  /* ---- SUMMER · warm amber, turquoise ---- */
  #mtp-root[data-theme="summer"] {
    --mtp-a1: #ef8018;
    --mtp-a2: #17b0c4;
    --mtp-fx: #ef8018;
    --mtp-cta2: #f2851f;
    --mtp-ink: #2b2118;
    --mtp-ink2: #6d6155;
    --mtp-page: linear-gradient(155deg, #fffdf7 0%, #fff2e2 45%, #ecfafc 100%);
    --mtp-glow1: rgba(239, 128, 24, 0.28);
    --mtp-glow2: rgba(23, 176, 196, 0.24);
    --mtp-line: rgba(239, 128, 24, 0.24);
    --mtp-shadow: rgba(120, 62, 12, 0.16);
    --mtp-scrim: linear-gradient(200deg, rgba(239, 128, 24, 0.20) 0%, rgba(255, 255, 255, 0) 45%, rgba(23, 176, 196, 0.24) 100%);
  }

  /* ---- AUTUMN · rust, gold ---- */
  #mtp-root[data-theme="autumn"] {
    --mtp-a1: #c2622a;
    --mtp-a2: #b4902f;
    --mtp-fx: #c2622a;
    --mtp-cta2: #c2622a;
    --mtp-ink: #2a1f18;
    --mtp-ink2: #6f6156;
    --mtp-page: linear-gradient(155deg, #fffaf4 0%, #faecdc 45%, #fdf3ec 100%);
    --mtp-glow1: rgba(194, 98, 42, 0.28);
    --mtp-glow2: rgba(180, 144, 47, 0.24);
    --mtp-line: rgba(194, 98, 42, 0.24);
    --mtp-shadow: rgba(97, 48, 20, 0.16);
    --mtp-scrim: linear-gradient(200deg, rgba(194, 98, 42, 0.24) 0%, rgba(255, 255, 255, 0) 45%, rgba(180, 144, 47, 0.24) 100%);
  }

  /* ---- WINTER · ice blue, silver ---- */
  #mtp-root[data-theme="winter"] {
    --mtp-a1: #2f7ba6;
    --mtp-a2: #8aa7c2;
    --mtp-fx: #7ba3c4;
    --mtp-cta2: #3f5fa8;
    --mtp-ink: #1c242c;
    --mtp-ink2: #5d6a76;
    --mtp-page: linear-gradient(155deg, #fbfdff 0%, #ecf3fa 45%, #faf7fb 100%);
    --mtp-glow1: rgba(47, 123, 166, 0.26);
    --mtp-glow2: rgba(138, 167, 194, 0.28);
    --mtp-line: rgba(47, 123, 166, 0.22);
    --mtp-shadow: rgba(22, 52, 76, 0.16);
    --mtp-scrim: linear-gradient(200deg, rgba(47, 123, 166, 0.22) 0%, rgba(255, 255, 255, 0) 45%, rgba(138, 167, 194, 0.26) 100%);
  }

  /* ---- WINTER · festive flavour, applied automatically in December ---- */
  #mtp-root[data-theme="festive"] {
    --mtp-a1: #b41e32;
    --mtp-a2: #1e7b3e;
    --mtp-fx: #b41e32;
    --mtp-cta2: #b41e32;
    --mtp-ink: #22201f;
    --mtp-ink2: #675f5d;
    --mtp-page: linear-gradient(155deg, #fffbfb 0%, #f6eeef 45%, #f0f6f1 100%);
    --mtp-glow1: rgba(180, 30, 50, 0.24);
    --mtp-glow2: rgba(30, 123, 62, 0.22);
    --mtp-line: rgba(180, 30, 50, 0.20);
    --mtp-shadow: rgba(74, 26, 32, 0.16);
    --mtp-scrim: linear-gradient(200deg, rgba(180, 30, 50, 0.22) 0%, rgba(255, 255, 255, 0) 45%, rgba(30, 123, 62, 0.22) 100%);
  }

  /* ==========================================================================
     3. RESET
     The popup is injected into an unknown page, so every inherited style is
     neutralised inside #mtp-root. Component rules below all carry the
     #mtp-root prefix so they out-specify this reset.
     Note: transform / animation / transition are deliberately NOT reset -
     an !important reset would outrank the keyframe animations.
     ========================================================================== */

  #mtp-root,
  #mtp-root *,
  #mtp-root *::before,
  #mtp-root *::after {
    box-sizing: border-box !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    outline: 0 !important;
    background: transparent none !important;
    box-shadow: none !important;
    color: inherit !important;
    font: inherit !important;
    font-family: var(--mtp-font) !important;
    line-height: 1.5 !important;
    letter-spacing: normal !important;
    text-transform: none !important;
    text-decoration: none !important;
    text-align: left !important;
    text-shadow: none !important;
    list-style: none !important;
    float: none !important;
    clear: none !important;
    vertical-align: baseline !important;
    min-width: 0 !important;
    min-height: 0 !important;
    max-width: none !important;
    max-height: none !important;
    overflow-wrap: break-word !important;
    -webkit-appearance: none !important;
    appearance: none !important;
  }

  /* ==========================================================================
     4. SHELL - fullscreen, never scrollable
     ========================================================================== */

  #mtp-root {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 2147483000 !important;
    overflow: hidden !important;
    overscroll-behavior: none !important;
    touch-action: none !important;
    background: var(--mtp-page) !important;
    color: var(--mtp-ink) !important;
    font-family: var(--mtp-font) !important;
    font-size: var(--mtp-fs-body) !important;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.45s ease, visibility 0.45s ease !important;
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: grayscale !important;
    -webkit-tap-highlight-color: transparent !important;
    contain: strict !important;
  }

  #mtp-root.mtp-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  /* Ambient light - two soft seasonal glows behind everything */
  #mtp-root::before {
    content: '' !important;
    position: absolute !important;
    inset: 0 !important;
    background:
      radial-gradient(60% 55% at 12% 8%,  var(--mtp-glow1) 0%, transparent 65%),
      radial-gradient(65% 60% at 92% 96%, var(--mtp-glow2) 0%, transparent 68%) !important;
    pointer-events: none !important;
    z-index: 0 !important;
  }

  /* ---- Stage: the responsive two-part layout ---- */
  #mtp-root .mtp-stage {
    position: relative !important;
    z-index: 1 !important;
    display: grid !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    /* Portrait / small screens: content takes the height it needs, the
       photo absorbs whatever is left over - so there is never a gap and
       never an overflow, on any screen height. */
    grid-template-columns: minmax(0, 1fr) !important;
    grid-template-rows: minmax(0, 1fr) minmax(0, auto) !important;
  }

  /* ==========================================================================
     5. VISUAL SIDE (photo slider)
     ========================================================================== */

  #mtp-root .mtp-visual {
    position: relative !important;
    z-index: 1 !important;
    overflow: hidden !important;
    background: linear-gradient(160deg, var(--mtp-glow1), var(--mtp-glow2)) !important;
  }

  #mtp-root .mtp-slide {
    position: absolute !important;
    inset: 0 !important;
    opacity: 0;
    transition: opacity 0.9s ease !important;
  }

  #mtp-root .mtp-slide.is-active { opacity: 1; }

  #mtp-root .mtp-slide img {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center 42% !important;
  }

  /* Seasonal colour wash + legibility gradient for the dots */
  #mtp-root .mtp-visual-scrim {
    position: absolute !important;
    inset: 0 !important;
    background:
      linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0) 34%),
      var(--mtp-scrim) !important;
    pointer-events: none !important;
    z-index: 2 !important;
  }

  /* Soft feather where the photo meets the content panel */
  #mtp-root .mtp-visual::after {
    content: '' !important;
    position: absolute !important;
    left: 0 !important;
    right: 0 !important;
    bottom: -1px !important;
    height: 22% !important;
    background: linear-gradient(0deg, var(--mtp-page) 0%, transparent 100%) !important;
    opacity: 0.9 !important;
    pointer-events: none !important;
    z-index: 3 !important;
  }

  /* ---- Season badge ---- */
  #mtp-root .mtp-badge {
    position: absolute !important;
    top: calc(var(--mtp-pad) + env(safe-area-inset-top, 0px)) !important;
    left: calc(var(--mtp-pad) + env(safe-area-inset-left, 0px)) !important;
    z-index: 4 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 0.5em !important;
    padding: 0.6em 1.05em !important;
    border-radius: 999px !important;
    background: rgba(255, 255, 255, 0.82) !important;
    backdrop-filter: blur(14px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(14px) saturate(160%) !important;
    color: var(--mtp-a1) !important;
    font-size: var(--mtp-fs-xs) !important;
    font-weight: 700 !important;
    letter-spacing: 0.14em !important;
    text-transform: uppercase !important;
    line-height: 1 !important;
    box-shadow: 0 6px 22px var(--mtp-shadow) !important;
  }

  #mtp-root .mtp-badge-icon {
    font-size: 1.25em !important;
    line-height: 1 !important;
    letter-spacing: normal !important;
  }

  /* ---- Slider dots ---- */
  #mtp-root .mtp-dots {
    position: absolute !important;
    left: 50% !important;
    bottom: calc(var(--mtp-pad) * 0.75) !important;
    transform: translateX(-50%);
    z-index: 5 !important;
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
    padding: 7px 11px !important;
    border-radius: 999px !important;
    background: rgba(255, 255, 255, 0.26) !important;
    backdrop-filter: blur(16px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4) !important;
  }

  #mtp-root .mtp-dot {
    width: clamp(16px, calc(var(--mtp-vw) * 1.6), 30px) !important;
    height: 4px !important;
    border-radius: 999px !important;
    background: rgba(255, 255, 255, 0.55) !important;
    cursor: pointer !important;
    transition: background 0.3s ease, width 0.3s ease !important;
    display: block !important;
  }

  #mtp-root .mtp-dot.is-active {
    background: #fff !important;
    width: clamp(26px, calc(var(--mtp-vw) * 2.6), 46px) !important;
  }

  #mtp-root .mtp-dot:hover { background: rgba(255, 255, 255, 0.85) !important; }

  /* ==========================================================================
     6. CONTENT PANEL
     ========================================================================== */

  #mtp-root .mtp-panel {
    position: relative !important;
    z-index: 3 !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-end !important;
    overflow: hidden !important;
    padding: var(--mtp-pad) !important;
    padding-top: calc(var(--mtp-pad) * 0.75) !important;
    padding-bottom: calc(var(--mtp-pad) + env(safe-area-inset-bottom, 0px)) !important;
  }

  /* Faint game-board watermark */
  #mtp-root .mtp-panel-mark {
    position: absolute !important;
    right: -8% !important;
    bottom: -12% !important;
    width: min(70%, 620px) !important;
    aspect-ratio: 1 / 1 !important;
    background: url('https://montresor.at/media/posts/9/responsive/lass-dein-herz-sprechen-spielfeld-xxxl.png') center / contain no-repeat !important;
    opacity: 0.055 !important;
    pointer-events: none !important;
    z-index: 0 !important;
  }

  #mtp-root .mtp-panel-inner {
    position: relative !important;
    z-index: 1 !important;
    display: flex !important;
    flex-direction: column !important;
    gap: var(--mtp-gap) !important;
    width: 100% !important;
    max-width: 34em !important;
    margin: 0 auto !important;
  }

  /* ---- Eyebrow (seasonal hook line) ---- */
  #mtp-root .mtp-eyebrow {
    display: flex !important;
    align-items: center !important;
    gap: 0.6em !important;
    color: var(--mtp-a1) !important;
    font-size: var(--mtp-fs-xs) !important;
    font-weight: 700 !important;
    letter-spacing: 0.16em !important;
    text-transform: uppercase !important;
    line-height: 1.3 !important;
  }

  #mtp-root .mtp-eyebrow-dot {
    flex: 0 0 auto !important;
    width: 0.5em !important;
    height: 0.5em !important;
    border-radius: 50% !important;
    background: currentColor !important;
    display: block !important;
  }

  /* ---- Title ---- */
  #mtp-root .mtp-title {
    font-size: var(--mtp-fs-title) !important;
    font-weight: 700 !important;
    line-height: 1.14 !important;
    letter-spacing: -0.015em !important;
    color: var(--mtp-ink) !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 3 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }

  #mtp-root .mtp-title-brand {
    background: linear-gradient(120deg, var(--mtp-brand) 0%, var(--mtp-cta2) 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
    color: var(--mtp-brand) !important;
  }

  /* ---- Subtitle ---- */
  #mtp-root .mtp-sub {
    font-size: var(--mtp-fs-body) !important;
    line-height: 1.6 !important;
    color: var(--mtp-ink2) !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 3 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }

  /* ---- Info chips - the details live behind these ---- */
  #mtp-root .mtp-chips {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: calc(var(--mtp-gap) * 0.5) !important;
  }

  #mtp-root .mtp-chip {
    display: inline-flex !important;
    align-items: center !important;
    gap: 0.5em !important;
    padding: 0.62em 0.95em !important;
    border-radius: 999px !important;
    background: var(--mtp-card) !important;
    box-shadow: inset 0 0 0 1px var(--mtp-line), 0 2px 10px var(--mtp-shadow) !important;
    color: var(--mtp-ink) !important;
    font-size: var(--mtp-fs-sm) !important;
    font-weight: 600 !important;
    line-height: 1.15 !important;
    white-space: nowrap !important;
    cursor: pointer !important;
    text-align: left !important;
    overflow: hidden !important;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, background 0.22s ease !important;
  }

  #mtp-root .mtp-chip-label {
    min-width: 0 !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }

  #mtp-root .mtp-chip:hover,
  #mtp-root .mtp-chip:focus-visible {
    background: rgba(255, 255, 255, 0.92) !important;
    transform: translateY(-2px);
    box-shadow: inset 0 0 0 1px var(--mtp-a1), 0 8px 20px var(--mtp-shadow) !important;
  }

  #mtp-root .mtp-chip-i {
    flex: 0 0 auto !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 1.45em !important;
    height: 1.45em !important;
    border-radius: 50% !important;
    background: var(--mtp-a1) !important;
    color: #fff !important;
    font-size: 0.82em !important;
    font-weight: 700 !important;
    font-style: italic !important;
    line-height: 1 !important;
  }

  /* ---- Buttons ---- */
  #mtp-root .mtp-actions {
    display: flex !important;
    flex-direction: column !important;
    gap: calc(var(--mtp-gap) * 0.55) !important;
  }

  #mtp-root .mtp-actions-row {
    display: flex !important;
    gap: calc(var(--mtp-gap) * 0.55) !important;
  }

  #mtp-root .mtp-btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 0.5em !important;
    padding: 0.92em 1.3em !important;
    border-radius: var(--mtp-r-sm) !important;
    font-size: var(--mtp-fs-btn) !important;
    font-weight: 700 !important;
    line-height: 1.15 !important;
    text-align: center !important;
    text-decoration: none !important;
    cursor: pointer !important;
    white-space: nowrap !important;
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, filter 0.22s ease !important;
  }

  #mtp-root .mtp-btn-primary {
    background: linear-gradient(120deg, var(--mtp-brand) 0%, var(--mtp-cta2) 100%) !important;
    color: #fff !important;
    box-shadow: 0 10px 26px var(--mtp-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
  }

  #mtp-root .mtp-btn-primary::after {
    content: '\2192' !important;
    font-weight: 400 !important;
    transition: transform 0.25s ease !important;
    display: inline-block !important;
  }

  #mtp-root .mtp-btn-primary:hover,
  #mtp-root .mtp-btn-primary:focus-visible {
    filter: brightness(1.07);
    transform: translateY(-2px);
    box-shadow: 0 14px 32px var(--mtp-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
    color: #fff !important;
  }

  #mtp-root .mtp-btn-primary:hover::after { transform: translateX(3px); }

  #mtp-root .mtp-btn-ghost {
    flex: 1 1 0 !important;
    background: var(--mtp-card2) !important;
    color: var(--mtp-ink) !important;
    font-weight: 600 !important;
    box-shadow: inset 0 0 0 1px var(--mtp-line) !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
  }

  #mtp-root .mtp-btn-ghost:hover,

    sheet: el('sheet'), sheetTitle: el('sheetTitle'), sheetBody: el('sheetBody'),
    sheetBack: el('sheetBack'), infoLabel: el('infoLabel'), back: el('back')
  };

  var slides = root.querySelectorAll('.mtp-slide');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var season = param('mtpTheme') || window.MTP_THEME || seasonFor(new Date());
  if (!THEMES[season]) season = seasonFor(new Date());
  var theme = THEMES[season];
  root.setAttribute('data-theme', season);

  /* ---- Language ---------------------------------------------------------- */
  function detectLang() {
    var forced = param('mtpLang');
    if (CONTENT[forced]) return forced;
    if (window.location.pathname.toLowerCase().indexOf('/english') !== -1) return 'en';
    var htmlLang = (document.documentElement.getAttribute('lang') || '').toLowerCase();
    if (htmlLang.indexOf('en') === 0) return 'en';
    if (htmlLang.indexOf('de') === 0) return 'de';
    var nav = (navigator.language || '').toLowerCase();
    return nav.indexOf('de') === 0 ? 'de' : (nav ? 'en' : 'de');
  }

  var lang = detectLang();

  function text(node, value) { if (node) node.textContent = value; }

  function render() {
    var c = CONTENT[lang];
    var s = c.seasons[season] || c.seasons.winter;

    root.setAttribute('data-lang', lang);
    root.setAttribute('lang', lang);

    text(ui.badge, s.badge);
    text(ui.badgeIcon, theme.icon);
    text(ui.eyebrow, s.line);
    text(ui.brand, c.brand);
    text(ui.title, c.title);
    text(ui.sub, c.sub);
    text(ui.cta, c.cta);
    text(ui.reviews, c.reviews);
    text(ui.more, c.more);
    text(ui.note, c.note);
    text(ui.infoLabel, c.infoLabel);
    text(ui.back, c.back);

    root.querySelectorAll('[data-mtp-link]').forEach(function (a) {
      a.setAttribute('href', c.links[a.getAttribute('data-mtp-link')]);
    });

    if (ui.close) ui.close.setAttribute('aria-label', c.close);
    if (ui.langGroup) ui.langGroup.setAttribute('aria-label', c.langLabel);

    /* Info chips - the detail texts sit behind these */
    if (ui.chips) {
      ui.chips.innerHTML = '';
      c.infos.forEach(function (info, i) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'mtp-chip';
        chip.setAttribute('data-mtp-info', String(i));
        var mark = document.createElement('span');
        mark.className = 'mtp-chip-i';
        mark.textContent = 'i';
        mark.setAttribute('aria-hidden', 'true');
        var label = document.createElement('span');
        label.className = 'mtp-chip-label';
        label.textContent = info.chip;
        chip.appendChild(mark);
        chip.appendChild(label);
        ui.chips.appendChild(chip);
      });
    }

    root.querySelectorAll('[data-mtp-lang]').forEach(function (b) {
      var on = b.getAttribute('data-mtp-lang') === lang;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    /* Keep an open sheet in sync when the language changes */
    if (ui.sheet && ui.sheet.classList.contains('is-open')) {
      var idx = parseInt(ui.sheet.getAttribute('data-mtp-index') || '0', 10);
      showSheet(idx);
    }
  }

  /* ---- Info sheet -------------------------------------------------------- */
  function showSheet(index) {
    var info = CONTENT[lang].infos[index];
    if (!info || !ui.sheet) return;
    ui.sheet.setAttribute('data-mtp-index', String(index));
    text(ui.sheetTitle, info.title);
    text(ui.sheetBody, info.body);
    ui.sheet.classList.add('is-open');
    ui.sheet.setAttribute('aria-hidden', 'false');
    if (ui.sheetBack) ui.sheetBack.focus();
  }

  function hideSheet() {
    if (!ui.sheet) return;
    ui.sheet.classList.remove('is-open');
    ui.sheet.setAttribute('aria-hidden', 'true');
  }

  /* ---- Photo slider ------------------------------------------------------ */
  var current = 0;
  var sliderTimer = null;
  var dots = [];

  function buildDots() {
    if (!ui.dots) return;
    ui.dots.innerHTML = '';
    dots = [];
    for (var i = 0; i < slides.length; i++) {
      (function (index) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'mtp-dot' + (index === 0 ? ' is-active' : '');
        dot.setAttribute('aria-label', CONTENT[lang].slideLabel + ' ' + (index + 1));
        dot.addEventListener('click', function () { goTo(index); restartSlider(); });
        ui.dots.appendChild(dot);
        dots.push(dot);
      })(i);
    }
  }

  function goTo(index) {
    current = (index + slides.length) % slides.length;
    for (var i = 0; i < slides.length; i++) {
      slides[i].classList.toggle('is-active', i === current);
      if (dots[i]) dots[i].classList.toggle('is-active', i === current);
    }
  }

  function restartSlider() {
    if (sliderTimer) clearInterval(sliderTimer);
    if (slides.length < 2) return;
    sliderTimer = setInterval(function () { goTo(current + 1); }, CONFIG.slideInterval);
  }

  function stopSlider() {
    if (sliderTimer) { clearInterval(sliderTimer); sliderTimer = null; }
  }

  /* ---- Seasonal particles ------------------------------------------------ */
  function rand(min, max) { return Math.random() * (max - min) + min; }

  function buildParticles() {
    if (!ui.fx) return;
    ui.fx.innerHTML = '';
    if (!CONFIG.particles || reduceMotion) return;
    if (navigator.connection && navigator.connection.saveData) return;

    var area = window.innerWidth * window.innerHeight;
    var count = Math.max(7, Math.min(24, Math.round(area / 46000)));

    for (var i = 0; i < count; i++) {
      var p = document.createElement('span');
      p.className = 'mtp-particle';
      p.textContent = theme.glyphs[i % theme.glyphs.length];
      var dur = rand(theme.dur[0], theme.dur[1]);
      p.style.left = rand(-2, 98) + '%';
      p.style.fontSize = rand(theme.size[0], theme.size[1]).toFixed(1) + 'px';
      p.style.animationName = theme.motion;
      p.style.animationDuration = dur.toFixed(2) + 's';
      p.style.animationDelay = (-rand(0, dur)).toFixed(2) + 's';
      p.style.setProperty('--mtp-dx', rand(-70, 70).toFixed(0) + 'px');
      p.style.setProperty('--mtp-rot', rand(-theme.rot, theme.rot).toFixed(0) + 'deg');
      p.style.setProperty('--mtp-o', (theme.opacity * rand(0.6, 1)).toFixed(2));
      ui.fx.appendChild(p);
    }
  }

  /* ---- Open / close ------------------------------------------------------ */
  var scrollLock = { html: '', body: '' };
  var lastFocus = null;

  function open() {
    lastFocus = document.activeElement;
    root.classList.add('mtp-open');
    root.setAttribute('aria-hidden', 'false');

    scrollLock.html = document.documentElement.style.overflow;
    scrollLock.body = document.body.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';

    buildParticles();
    restartSlider();
    if (ui.close) ui.close.focus();
  }

  function close() {
    root.classList.remove('mtp-open');
    root.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = scrollLock.html;
    document.body.style.overflow = scrollLock.body;
    stopSlider();
    hideSheet();
    if (ui.fx) ui.fx.innerHTML = '';
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }

  function isOpen() { return root.classList.contains('mtp-open'); }

  /* ---- Events ------------------------------------------------------------ */
  root.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('[data-mtp-info]') : null;
    if (chip) { e.preventDefault(); showSheet(parseInt(chip.getAttribute('data-mtp-info'), 10)); return; }

    var langBtn = e.target.closest ? e.target.closest('[data-mtp-lang]') : null;
    if (langBtn) {
      e.preventDefault();
      lang = langBtn.getAttribute('data-mtp-lang');
      render();
      buildDots();
      goTo(current);
      return;
    }

    if (e.target.closest && e.target.closest('[data-mtp-el="sheetBack"]')) { e.preventDefault(); hideSheet(); return; }
    if (e.target.closest && e.target.closest('[data-mtp-el="close"]')) { e.preventDefault(); close(); }
  });

  document.addEventListener('keydown', function (e) {
    if (!isOpen()) return;
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (ui.sheet && ui.sheet.classList.contains('is-open')) hideSheet();
      else close();
      return;
    }
    if (e.key !== 'Tab') return;

    /* Keep keyboard focus inside the dialog - a hidden info sheet must not
       catch the tab order */
    var focusable = root.querySelectorAll('a[href], button:not([disabled])');
    var visible = [];
    for (var i = 0; i < focusable.length; i++) {
      var node = focusable[i];
      var shown = node.checkVisibility
        ? node.checkVisibility({ visibilityProperty: true, opacityProperty: true })
        : node.offsetParent !== null;
      if (shown) visible.push(node);
    }
    if (!visible.length) return;
    var first = visible[0], last = visible[visible.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* Pause the slideshow while the visitor reads or the tab is hidden */
  var visual = root.querySelector('.mtp-visual');
  if (visual) {
    visual.addEventListener('mouseenter', stopSlider);
    visual.addEventListener('mouseleave', function () { if (isOpen()) restartSlider(); });
  }

  document.addEventListener('visibilitychange', function () {
    if (!isOpen()) return;
    if (document.hidden) stopSlider(); else restartSlider();
  });

  /* Re-balance particle density after a resize or rotation */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (!isOpen()) return;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildParticles, 400);
  });

  /* Nothing inside the popup scrolls - block rubber-banding on iOS */
  root.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  /* ---- Start ------------------------------------------------------------- */
  function seen() {
    try { return sessionStorage.getItem('mtpShown') === '1'; } catch (e) { return false; }
  }
  function markSeen() {
    try { sessionStorage.setItem('mtpShown', '1'); } catch (e) {}
  }

  render();
  buildDots();

  if (CONFIG.oncePerSession && seen() && !param('mtpForce')) return;

  setTimeout(function () {
    if (CONFIG.oncePerSession) markSeen();
    open();
  }, CONFIG.showDelay);
})();
</script>
<!-- Mon Tresor Popup - END -->
